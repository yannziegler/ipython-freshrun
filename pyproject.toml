[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ipython-freshrun"
version = "0.1.0b1"
description = "Run Python scripts in genuinely fresh interactive IPython sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "EUPL-1.2"
license-files = { file = "LICEN[CS]E*" }
authors = [
    { name = "Yann Ziegler" },
]
keywords = [
    "ipython",
    "interactive",
    "repl",
    "debugging",
    "development",
    "run",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: IPython",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Shells",
]

dependencies = [
    "ipython>=9,<10",
    "prompt-toolkit>=3.0",
    "Pygments>=2.0",
]


[project.urls]
Homepage = "https://github.com/yannziegler/ipython-freshrun"
Repository = "https://github.com/yannziegler/ipython-freshrun"
Issues = "https://github.com/yannziegler/ipython-freshrun/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/freshrun"]


[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]


[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]
